name: ci
on:
  push:
    branches:
      - trunk
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/publish.yaml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:

      - name: 'Checkout repo'
        uses: actions/checkout@v7

      - name: 'Find TS3 version'
        run: echo "TS3_VERSION=$(echo "$(cat Dockerfile | grep "VERSION=")" | sed -E 's/.*=//g' | tr -d '"')" >> $GITHUB_ENV

      - name: 'Docker Hub login'
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Build and publish image'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ts3:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ts3:${{ env.TS3_VERSION }}

      # Base image digest bumps rebuild the same TS3 version, so the tag may already exist.
      - name: 'Tag release'
        run: |
          tag="v${TS3_VERSION}"
          if test -n "$(git ls-remote --tags origin "refs/tags/${tag}")"; then
            echo "${tag} exists"
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"
